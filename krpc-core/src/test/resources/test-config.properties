# Test Configuration for RPC Framework
# This file contains configuration for running tests

# Test server configuration
test.server.host=127.0.0.1
test.server.port.start=9000
test.server.port.end=9099

# Circuit breaker test configuration
test.circuitbreaker.failure.threshold=2
test.circuitbreaker.success.rate=0.5
test.circuitbreaker.retry.period.ms=1000

# Rate limiting test configuration
test.ratelimit.capacity=10
test.ratelimit.refill.rate=5

# Load balancer test configuration
test.loadbalancer.servers=server1:8080,server2:8080,server3:8080

# Service discovery test configuration
test.servicediscovery.timeout.ms=5000
test.servicediscovery.retry.attempts=3

# Integration test configuration
test.integration.concurrent.threads=10
test.integration.calls.per.thread=5
test.integration.timeout.seconds=30

# Mock ZooKeeper configuration (for tests that don't require real ZK)
test.zookeeper.mock.enabled=true
test.zookeeper.mock.services=org.example.service.UserService:127.0.0.1:8080,org.example.service.TestService:127.0.0.1:9090